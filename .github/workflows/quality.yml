name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript syntax checks
        run: npm run check

      - name: Security and data-integrity regression tests
        run: npm test

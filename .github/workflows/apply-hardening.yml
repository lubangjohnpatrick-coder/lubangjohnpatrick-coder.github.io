name: Apply Hardening Migration

on:
  push:
    branches:
      - fix/production-hardening

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply deterministic HTML/CSS migration
        run: node scripts/apply-hardening.mjs

      - name: Commit generated migration changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git commit -m "Apply production HTML and CSS hardening"
          git push origin HEAD:fix/production-hardening
